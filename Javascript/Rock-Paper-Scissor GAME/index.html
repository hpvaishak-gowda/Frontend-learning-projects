<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock-paper-scissor</title>
</head>
<body>
    <head>
        <h1>Rock Paper Scissor Game ;</h1>
        <br>
        <h3>Choose one ;</h3>
    </head>
    <body>

        <button onclick="
            if(status=== 'Rock'){
                result='Tie';
            }
            else if(status == 'Paper'){
                result='You Lose';
            }
            else{
                result='You Won';
            }
            
            alert(`computer choose ${status} \n${result}`);
        ">Rock</button>
        
        <button onclick="
            if(status=== 'Scissor'){
                result='Tie';
            }
            else if(status == 'Paper'){
                result='You Won';
            }
            else{
                result='You Lose';
            }
            
            alert(`computer choose ${status} \n${result}`);
        
        ">Scissor</button>
        
        
        <button onclick="
            if(status=== 'Rock'){
                result='Yow Lose';
            }
            else if(status == 'Paper'){
                result='Tie';
            }
            else{
                result='You Won';
            }
            
           alert(`computer choose ${status} \n${result}`);
        ">Paper</button>
    </body>
    <script>
        let result='';
        let status='';
        let random = Math.random();

        if(random <=1/3){
            status= 'Rock';
        }
        else if(random <= 2/3){
            status = 'Paper';
        }
        else{
            status = 'Scissor';
        }
        console.log(status);
        

    </script>
</body>
</html>
